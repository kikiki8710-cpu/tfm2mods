# tfm2_item_build - 설정
#
# write = 1  →  전술화면에서 지정한 아이템 빌드를 실제 경기에 적용한다. (기본)
# write = 0  →  아무것도 쓰지 않고 계획만 계산한다(드라이런). log = 1 과 함께 쓰면
#               "무엇을 적용하려 했는지"만 로그로 확인할 수 있다.
#
# log = 0    →  진단 로그를 남기지 않는다. (기본, 프로덕션)
# log = 1    →  mods\tfm2_item_build\item_build.log 에 상세 진단을 남긴다.
#               경기마다 수백 줄이 쌓이므로 문제를 쫓을 때만 켤 것.
#
# ※ 게임 재시작 불필요 - 경기가 시작될 때마다 다시 읽는다.
#
# tfm2_item_build - settings
#
# write = 1  ->  apply the item builds picked on the tactics screen to real matches. (default)
# write = 0  ->  compute the plan but write nothing (dry run).
# log   = 0  ->  no diagnostic log. (default, production)
# log   = 1  ->  write a verbose log to mods\tfm2_item_build\item_build.log
#                (hundreds of lines per match - turn on only while debugging).
#
# Note: no game restart needed - re-read at the start of every match.

write = 1
log = 0
