# ★[2026-08-07] 빌드 산출물에 **로컬 경로가 박히는 것**을 막는다(개인정보 유출 방지).
#
# 왜 필요한가: rustc 는 panic location 등으로 소스 절대경로를 바이너리에 넣는다. 모드 dll 은
# 소스가 `C:\tfm2mods\` 아래라 무해했지만, 편집기는 **cargo 로 빌드**해서 의존 크레이트의
# registry 경로(`C:\Users\<user>\.cargo\registry\...`)가 그대로 박혔다 — 실측 75종.
# 그 상태로 릴리스 zip 에 들어가고 있었다(0.5.4 zip 검증에서 발각).
#
# ⚠같은 함정이 `legacy_save_patcher` 에서 이미 한 번 터졌다("재빌드 불요 모드도 PII 검사 대상",
# [[tfm2-release-zip-location]]). 그때는 dll 을 재빌드해 해소했는데, **편집기는 빠져 있었다.**
#
# ⚠`build_inj.ps1` 이 쓰는 `$env:RUSTFLAGS` 방식은 `cmd /c` 자식에 전달되지 않아 실효가 없었다
# (2026-07-18 사고). 그래서 여기선 환경변수가 아니라 **프로젝트 설정 파일**로 못 박는다 —
# 누가 어떤 셸에서 빌드하든 항상 적용된다.
[build]
rustflags = [
  "--remap-path-prefix=C:\\Users\\dev\\.cargo=cargo",
  "--remap-path-prefix=C:\\tfm2mods=src",
]
