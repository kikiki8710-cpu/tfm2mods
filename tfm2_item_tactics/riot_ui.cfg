# tfm2_item_tactics - 조합테스트 아이템 지정 UI 선택
#
# riot_ui = 0  →  롤아이템모드(riot_items_tfm2)의 빌드 편집기를 숨기고,
#                 이 모드의 4칸 개인전술 표를 쓴다. 선택은 item_tactics_sel.txt 에
#                 @b: / @r: 스코프로 저장된다. (기본)
# riot_ui = 1  →  롤아이템모드의 빌드 편집기를 그대로 쓴다.
#                 선택은 롤아이템모드의 item-builds.json 에 저장된다.
#                 (이 모드의 표는 나오지 않는다)
#
# ※ 게임 재시작 불필요 - 조합테스트 화면이 떠 있는 동안 약 2초마다 다시 읽는다.
# ※ 이 값을 4items.cfg 에 넣지 말 것. 그 파일은 마지막 '=' 뒤만 읽으므로 slots 설정이 깨진다.
#
# tfm2_item_tactics - which comp-test item build editor to use
#
# riot_ui = 0  ->  hide the Riot Items mod's build editor and use this mod's
#                  4-slot personal tactics table. Picks are saved to
#                  item_tactics_sel.txt with @b: / @r: scope prefixes. (default)
# riot_ui = 1  ->  keep the Riot Items mod's build editor.
#                  Picks are saved to that mod's item-builds.json instead,
#                  and this mod's table is not shown.
#
# Note: no game restart needed - re-read about every 2 seconds while the
#       comp test screen is open.
# Note: do NOT put this key in 4items.cfg - that file is parsed by reading
#       after the LAST '=', so an extra key breaks the slots setting.

riot_ui = 0
