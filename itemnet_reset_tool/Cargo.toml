[package]
name = "itemnet_reset_tool"
version = "1.0.0"
edition = "2021"
description = "TFM2 세이브 아이템 추천 신경망 공장 초기화 (외부 툴)"

[[bin]]
name = "아이템신경망_초기화"
path = "src/main.rs"

[dependencies]
rfd = "0.14"
flate2 = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
