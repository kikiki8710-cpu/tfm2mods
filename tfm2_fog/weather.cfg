# tfm2_fog 날씨 설정 — 누구나 추가/편집 가능. (BOM 없는 UTF-8 로 저장하세요.)
#
# 사용법:
#   1) PNG 를 mods\tfm2_fog\ui\ 폴더에 넣으세요.  (예: ui\fog_0.png, ui\rain_0.png ...)
#   2) 아래 [날씨] 블록에 img = 파일이름  으로 프레임을 순서대로 나열하세요(확장자 제외).
#      - 장수는 img 줄 수로 자동 결정(1장=정지, 여러 장=flipbook 애니메이션). 최대 24장.
#   3) active = 에 보여줄 날씨 이름을 적으세요.
#   ※ 날씨/이미지를 바꾸면 게임을 재시작해야 새 이미지가 로드됩니다(엔진 특성).
# dll 을 고칠 필요 없이 이 파일 + PNG 만으로 날씨를 추가할 수 있습니다.

active = rain          # 보여줄 날씨 (아래 [이름] 중 하나)

# ── 전역 기본값 (각 [날씨] 에서 같은 키로 개별 오버라이드 가능) ──
period = 18            # 애니메이션 속도: 장당 게임프레임 (클수록 느림)
alpha  = 64            # 농도 0~255 (클수록 진함)
size   = 6400          # 안개 크기 (월드 단위, 정사각)
x      = -160          # 시작 위치 x
y      = -160          # 시작 위치 y
scale  = 5.0           # 텍스처 타일 반복 횟수 (클수록 무늬가 촘촘)

# ── 날씨 정의 ──
[rain]                 # 비 (대각선 빗줄기가 떨어짐)
period = 3             # 비는 빠르게
alpha  = 140           # 빗줄기가 얇아 조금 진하게
scale  = 6.0           # 줄기를 잘게(반복 많이)
img = rain_0
img = rain_1
img = rain_2
img = rain_3
img = rain_4
img = rain_5
img = rain_6
img = rain_7
img = rain_8
img = rain_9
img = rain_10
img = rain_11

[fog]                  # 안개 (뭉게구름)
period = 18
alpha  = 64
scale  = 5.0
img = fog_0
img = fog_1
img = fog_2
img = fog_3
img = fog_4
img = fog_5
img = fog_6
img = fog_7
img = fog_8
img = fog_9
img = fog_10
img = fog_11
