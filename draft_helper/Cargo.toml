[package]
name = "tfm2_draft_helper"
version = "0.1.0"
edition = "2021"
description = "TFM2 모의 밴픽 도우미 (독립 egui, 게임 AI 재현 + 메타 통계 추천)"

[[bin]]
name = "tfm2_draft_helper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
