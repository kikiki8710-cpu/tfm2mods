# tfm2_stat_exp 설정 — 판단력/오더 강제 덮어쓰기 통제실험
# 값 변경 후 게임 전체 재시작해야 적용됩니다. '#' 뒤는 주석.
#
# side  : blue / red / all   (덮어쓸 진영)
# slot  : 0~4 또는 all        (그 진영에서 덮어쓸 선수 슬롯)
# judgement : -1 = 원본유지(무개입) / 0 이상 = 그 값으로 매 틱 강제
# order     : -1 = 원본유지(무개입) / 0 이상 = 그 값으로 매 틱 강제
# histogram : 1 = 액션상태(U+0xA47) 관측 집계 ON(기본) / 0 = OFF (freeze 등 문제 시 끄기)
# watchpoint: 1 = HW 데이터 워치포인트로 오더 콜큐 소비자 RIP 포착 / 0 = OFF(기본·고위험)
#             ★고급 진단용. 켜면 전 스레드 디버그레지스터 설정 → 부하/불안정 가능. 문제 시 0으로.
#             총히트 5000 or 유니크 RIP 60 도달 시 자동해제(상시감시 아님).
#
# ⚠ 기본값(judgement/order 전부 -1)이면 어떤 메모리도 건드리지 않습니다(완전 안전·무개입·관찰만).
#    실험하려면 judgement 또는 order 를 0 이상 값으로 바꾸세요.

side=blue
slot=0
judgement=-1
order=-1
histogram=1
watchpoint=0
