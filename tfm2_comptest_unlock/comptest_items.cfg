layout = 4

# ---------------------------------------------------------------
# 형식:  슬롯 = 아이템id, 아이템id, 아이템id      (슬롯당 3칸)
#   슬롯 = UI 라인업 순서 0~9
#   아이템 id = 바닐라 0~29 / 모드 아이템 30 이상
#   0 을 적거나 생략하면 그 칸은 게임이 정한 값 그대로 둠
#
# ※이 cfg 경로는 그대로 동작한다(오버레이 UI 와 별개).
#   인게임 UI 없이 파일로 고정 지정하고 싶을 때 사용.
#
# 바닐라 최종템 id 참고 (카테고리 매핑 기준):
#   4  = warlords_final_judgement      24 = prophet_of_the_abyss
#   9  = storm_sovereign               14 = impregnable_fortress
#   19 = veil_of_annihilation          29 = giants_horn_shard
#
# ※ 변경 후 게임 재시작 필요
