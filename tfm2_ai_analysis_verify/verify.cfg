# armed=true로 바꾼 다음 실행에서 관측합니다.
# 최초 설치는 경기/배경 시뮬레이션이 없는 초기 화면에서 수행합니다.
armed=false
# 첫 관측은 한 함수부터. 다섯 후보 전체는 아래 목록으로 바꿀 수 있습니다.
# probes=e49c00,fa9dc0,f51e50,e9eb70,fdb9a0
probes=fdb9a0
sample_stride=64
max_samples_per_probe=1000
queue_capacity=256
install_delay_frames=120
allow_foreign_chain=false
