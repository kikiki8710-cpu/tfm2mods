# 임계점 트레이서 설정 (v0.5.4). 게임 판단은 바꾸지 않는다. 바꾼 뒤 게임 전체 재시작.
trace=false
# 비우면 표의 전 지점(42,307 = v0.5.2 41,516 + 추가 791 — tools/sites/extra_v054.txt). 쉼표로 함수 RVA 를 적으면 그 함수의 비교만 건다.
functions=
# 지점당 window_ms 동안 cap_per_window 번까지 세고, 넘으면 그 창이 끝날 때까지 관측점을 뗀다(속도 보호).
window_ms=10000
cap_per_window=64
# 창마다 전 지점 합계 상한. 넘으면 그 뒤 적중한 지점은 기록 후 그 창 동안 쉰다.
global_cap_per_window=300000
# 누적 스냅샷 간격. 마지막 줄 = 최종값(게임 정상 종료 때도 한 번 씀). 15초는 3시간에 556MB가 됐다.
snapshot_ms=300000
install_delay_frames=360
# 30초마다 덮어쓰는 최신 누적값(sites_<run>_latest.json). 종료 직전 jsonl 유실 대비.
latest_ms=30000
# 비우면 전 지점. 모드 폴더 기준 파일에 지점 id 를 적으면 그것만 건다(집중 관측). tools/make_focus.py 로 만든다.
