# 임계점 트레이서 설정 (v0.7.3 · 게임 0.6.5). 게임 판단은 바꾸지 않는다. 바꾼 뒤 게임 전체 재시작.
trace=false
# 비우면 표의 전 지점(0.6.5 44,499 = 아틀라스 기록 + 추가 4,749 — tools/sites065/extra_v065_all.txt(대응 정정 v0.7.2 4곳 + v0.7.3 1곳 = extra_v065_fix.txt) · 0.6.4 표 = tools/sites/v064/). 쉼표로 함수 RVA 를 적으면 그 함수의 비교만 건다.
functions=
# 지점당 window_ms 동안 cap_per_window 번까지 세고, 넘으면 그 창이 끝날 때까지 관측점을 뗀다(속도 보호).
window_ms=10000
cap_per_window=64
# 창마다 전 지점 합계 상한. 넘으면 그 뒤 적중한 지점은 기록 후 그 창 동안 쉰다.
global_cap_per_window=300000
# 누적 스냅샷 간격. 마지막 줄 = 최종값(게임 정상 종료 때도 한 번 씀). 15초는 3시간에 556MB가 됐다.
snapshot_ms=300000
install_delay_frames=360
# 30초마다 덮어쓰는 최신 누적값(sites_<run>_latest.json). 종료 직전 jsonl 유실 대비.
latest_ms=30000
# 비우면 전 지점. 모드 폴더 기준 파일에 지점 id 를 적으면 그것만 건다(집중 관측). tools/make_focus.py 로 만든다.
# focus_file=focus_sites.txt
# v0.7.2 10회차 = focus_sites_065.txt(tools/make_focus_065.py: 9회차 예산 포화 비교 + 분모 제외 아닌 미도달 13,140곳) · 이때 cap_per_window=4096 · global_cap_per_window=1000000
# v0.7.3 11회차 = focus_sites_065b.txt(9·10회차 미도달 중 분모 제외 아닌 12,049곳 · make_focus_065.py --unreached-only) — 오우거·요리사 픽 판
# v0.7.0 이벤트 트레이서: events=true 면 events_generated.rs 지점(현재 = 0.6.5 우물 대기 6지점)에서 값 여러 개를 시간순으로 events_<run>.jsonl 에 기록.
# events_only=true 면 이벤트 지점만 건다(임계점 관측 생략 → 가벼움). 판독 = tools/events_report.py
events=false
events_only=false
