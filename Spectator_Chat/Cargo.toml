[package]
name = "Spectator_Chat"
version = "0.6.0"
edition = "2021"

# 0.6.0+: stable ABI port (mod-api-stable). classic source = tfm2-mods-main\Spectator_Chat (daram2).
# spectator chat rewritten on stable: sim match hook collects events, client shows them by played tick (game_time label).
# build: cargo build --release

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-api-stable = { path = "../sdk_060_stable/mod-api-stable" }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 1
