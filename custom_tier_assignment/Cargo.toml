[package]
name = "custom_tier_assignment"
version = "0.6.0"
edition = "2021"

# 0.6.0+: stable ABI port (mod-api-stable). classic source = tfm2-mods-main\custom_tier_assignment (daram2).
# tiers are computed client-side (champion_brief + bundle champion_info sheet) and written server-side (team_set_json + unicast_team).
# build: cargo build --release

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-api-stable = { path = "../sdk_060_stable/mod-api-stable" }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 1
